<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | Free Tuition Media</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="siteHeader"></div><main><section class="section"><div class="container form-container narrow"><span class="eyebrow">Join the platform</span><h1>Create your account</h1><form id="registerForm" class="form-grid"><label>Full Name<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>Phone<input required name="phone"></label><label>Account Type<select required name="role"><option value="">Select</option><option>Tutor</option><option>Student / Guardian</option></select></label><label>Password<input required type="password" name="password" minlength="6"></label><label>Confirm Password<input required type="password" name="confirm"></label><button class="btn full-field">Create Account</button></form><div id="formMessage"></div></div></section></main><div id="siteFooter"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
