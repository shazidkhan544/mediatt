<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Post a Tuition | Free Tuition Media</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="siteHeader"></div><main><section class="section"><div class="container form-container"><span class="eyebrow">For students & guardians</span><h1>Post a Tuition</h1><p>Tell us what kind of tutor you need.</p><form id="postTuitionForm" class="form-grid"><label>Student/Guardian Name<input required name="name"></label><label>Phone Number<input required name="phone" pattern="[0-9+ -]{8,}"></label><label>Location<select required name="location"><option value="">Select</option><option>Uttara</option><option>Mirpur</option><option>Dhanmondi</option><option>Mohammadpur</option><option>Badda</option><option>Banani</option></select></label><label>Class<select required name="className"><option value="">Select</option><option>Class 1-5</option><option>Class 6-8</option><option>Class 9-10</option><option>Class 11-12</option><option>University</option></select></label><label>Subject<input required name="subject"></label><label>Preferred Tutor Gender<select name="gender"><option>Any</option><option>Female</option><option>Male</option></select></label><label>Days Per Week<input required type="number" min="1" max="7" name="days"></label><label>Monthly Budget (BDT)<input required type="number" min="0" name="salary"></label><label class="full-field">Details<textarea name="description" rows="5" placeholder="Write any additional requirements"></textarea></label><button class="btn full-field" type="submit">Submit Tuition Request</button></form><div id="formMessage"></div></div></section></main><div id="siteFooter"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
